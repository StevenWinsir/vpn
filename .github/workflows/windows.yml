name: Windows client CI

# Scope: the .NET solution builds, its contract tests pass, the GUI and service binaries
# start, (round 2) the Go Core and the TUN harness build, vet and pass their tests
# natively on a real x64 Windows host, and (round 3) the Windows-kernel tests run and the INTERNAL
# stage is installed as a real service and driven GUI -> Service -> Core, then attacked
# (scripts/windows/e2e-service.ps1). This does NOT create a TUN, change routes or DNS,
# and does not test the UAC prompt (the runner is non-interactive and already elevated): the runner is
# Windows Server, not a Windows 10/11 client, and a TUN that captures the default route would cut the
# runner off from GitHub.
# Round 8 adds a TEST-signed (self-signed) Inno Setup installer that is installed, reinstalled, refused, rolled back,
# downgrade-refused and uninstalled for real. It is signed with a throw-away certificate nobody trusts; no trusted signature exists.
# The real TUN run (cases T01-T09) is done with asterlink-tuntest.exe on an authorised
# machine; see docs/windows-tun-poc.md.

on:
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'native/core/**'
      - 'native/third_party/**'
      - 'scripts/prepare_mihomo.py'
      - 'scripts/test-mihomo-patches.py'
      - 'native/nodeagent/**'
      - 'shared/**'
      - 'scripts/test-native-windows.py'
      - 'scripts/package-native-windows.py'
      - 'scripts/windows_release.py'
      - 'scripts/windows/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths:
      - 'apps/windows/**'
      - 'native/core/**'
      - 'native/third_party/**'
      - 'scripts/prepare_mihomo.py'
      - 'scripts/test-mihomo-patches.py'
      - 'native/nodeagent/**'
      - 'shared/**'
      - 'scripts/test-native-windows.py'
      - 'scripts/package-native-windows.py'
      - 'scripts/windows_release.py'
      - 'scripts/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  SOLUTION: apps/windows/AsterLink.sln
  GO_VERSION: '1.26.6'
  INNO_VERSION: '6.7.1'
  ASTERLINK_INNO_VERSION: '6.7.1'

jobs:
  windows-x64:
    name: Windows x64 build / test / start
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json

      - name: Record the real machine (OS, architecture, toolchain)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $machine = [ordered]@{
            os_caption       = $os.Caption
            os_version       = $os.Version
            os_build         = $os.BuildNumber
            os_architecture  = $os.OSArchitecture
            os_is_client     = ($os.ProductType -eq 1)
            cpu              = $cpu.Name
            processor_arch   = $env:PROCESSOR_ARCHITECTURE
            dotnet_sdk       = (dotnet --version)
            runner_image     = $env:ImageOS + ' ' + $env:ImageVersion
          }
          $machine | ConvertTo-Json | Tee-Object artifacts/windows/machine.json
          if ($os.OSArchitecture -notlike '64-bit*' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw 'This job must run on a native x64 Windows host'
          }

      - name: Restore (locked dependencies)
        run: dotnet restore $env:SOLUTION --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build $env:SOLUTION -c Release --no-restore

      - name: Unit and contract tests
        run: dotnet test apps/windows/AsterLink.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/windows/test-results

      - name: Publish self-contained win-x64 (the RID comes from the csproj; no trimming, AOT or single-file)
        run: |
          dotnet publish apps/windows/AsterLink.App -c Release --self-contained true -p:RestoreLockedMode=true -o artifacts/windows/publish/app
          dotnet publish apps/windows/AsterLink.Service -c Release --self-contained true -p:RestoreLockedMode=true -o artifacts/windows/publish/service

      - name: Published binaries are 64-bit x64 PE files
        shell: pwsh
        run: |
          foreach ($exe in 'artifacts/windows/publish/app/AsterLink.exe', 'artifacts/windows/publish/service/AsterLink.Service.exe') {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
            "{0}: machine=0x{1:X4} optional_magic=0x{2:X4}" -f $exe, $machine, $magic
            if ($machine -ne 0x8664 -or $magic -ne 0x20B) { throw "$exe is not an x64 PE32+ image" }
          }

      - name: GUI opens its window on a real desktop (self-test)
        shell: pwsh
        run: |
          $report = 'artifacts/windows/gui-selftest.json'
          $p = Start-Process -FilePath 'artifacts/windows/publish/app/AsterLink.exe' -ArgumentList '--self-test', $report -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'GUI did not finish its self-test within 60 s' }
          if (-not (Test-Path $report)) { throw "GUI exited with code $($p.ExitCode) and wrote no report" }
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "GUI self-test failed with exit code $($p.ExitCode)" }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.window.rendered) { throw 'window was not rendered' }
          if (-not $json.platform.is_native_windows_x64) { throw 'GUI did not run as native Windows x64' }
          foreach ($page in 'login', 'connect', 'nodes', 'settings') {
            if (-not $json.pages.$page) { throw "page '$page' did not load and lay out" }
          }

      - name: GUI design preview - every page, empty state, error, dark and 200 percent rendered to PNG (scripted Core, no service)
        shell: pwsh
        run: |
          $dir = 'artifacts/windows/ui-preview'
          $p = Start-Process -FilePath 'artifacts/windows/publish/app/AsterLink.exe' -ArgumentList '--preview', $dir -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'GUI preview did not finish within 120 s' }
          if (Test-Path "$dir/preview-error.txt") { Get-Content "$dir/preview-error.txt"; throw 'GUI preview failed' }
          if ($p.ExitCode -ne 0) { throw "GUI preview failed with exit code $($p.ExitCode)" }
          $index = Get-Content "$dir/index.json" -Raw | ConvertFrom-Json
          "$($index.count) pages rendered"
          if ($index.count -lt 20) { throw 'GUI preview rendered fewer pages than expected' }

      - name: Service binary starts and reports (probe, not installed as a service)
        shell: pwsh
        run: |
          $out = & 'artifacts/windows/publish/service/AsterLink.Service.exe' --probe
          if ($LASTEXITCODE -ne 0) { throw "service probe failed with exit code $LASTEXITCODE" }
          $out | Tee-Object artifacts/windows/service-probe.txt
          if (-not ($out -match '"is_native_windows_x64": true')) { throw 'service did not run as native Windows x64' }

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/core/go.sum

      - name: Go Core and TUN harness - split, PE build, vet, embedded Wintun, native tests
        run: py -3 scripts/test-native-windows.py --suite core --out artifacts/windows/core --report artifacts/windows/core-suite.json

      - name: Billing suite - ledger, ack-loss and harness tests, billtest and sink builds (the live run is BLOCKED here by design)
        shell: pwsh
        run: |
          py -3 scripts/test-native-windows.py --suite billing --out artifacts/windows/billing --report artifacts/windows/billing-suite.json
          # 0 would mean the live part ran on a hosted runner; 3 is the only expected result (nothing else FAILed).
          if ($LASTEXITCODE -ne 3) { throw "billing suite exited $LASTEXITCODE, expected 3 (live part BLOCKED, everything else PASS)" }
          exit 0

      - name: Grants suite - node-enforcement harness vs a fake managed node, grant state machine, builds for Windows/macOS/Linux (the live run is BLOCKED here by design)
        shell: pwsh
        run: |
          py -3 scripts/test-native-windows.py --suite grants --out artifacts/windows/grants --report artifacts/windows/grants-suite.json
          # 3 = only the live part and the Linux-only node agent tests are BLOCKED; anything else is a real result.
          if ($LASTEXITCODE -ne 3) { throw "grants suite exited $LASTEXITCODE, expected 3 (live part BLOCKED, everything else PASS)" }
          exit 0

      - name: Embedded Wintun DLL is the signed official build
        shell: pwsh
        run: |
          Push-Location native/core
          $dir = (go list -m -f '{{.Dir}}' github.com/metacubex/sing-tun)
          Pop-Location
          $dll = Join-Path $dir 'internal/wintun/amd64/wintun.dll'
          $sig = Get-AuthenticodeSignature $dll
          $sig | Format-List Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter | Tee-Object artifacts/windows/wintun-signature.txt
          if ($sig.Status -ne 'Valid') { throw "wintun.dll signature is $($sig.Status)" }

      - name: Core and harness refuse to run unsafely (no network change is attempted)
        shell: pwsh
        run: |
          $core = 'artifacts/windows/core/asterlink-core.exe'
          & $core --version
          if ($LASTEXITCODE -ne 0) { throw '--version failed' }
          # Started by hand there are no IPC handles: it must fail closed, not fall back to stdout.
          & $core 2> $null
          if ($LASTEXITCODE -ne 1) { throw "Core without IPC handles exited $LASTEXITCODE, expected 1" }
          $harness = 'artifacts/windows/core/asterlink-tuntest.exe'
          & $harness
          if ($LASTEXITCODE -ne 3) { throw "harness without --allow-network-changes exited $LASTEXITCODE, expected 3 (BLOCKED)" }
          # pwsh ends the step with the last native exit code (3 here); the checks above are the verdict.
          Get-FileHash $core, $harness -Algorithm SHA256 | Format-Table Hash, Path -AutoSize
          exit 0

      - name: PowerShell test scripts parse (syntax) and the recovery verifier runs its post-condition checks on an idle runner
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts/windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $bad++; $errors | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" } }
            else { Write-Host "parsed $($f.Name)" }
          }
          if ($bad -gt 0) { throw "$bad script(s) have syntax errors" }
          # Verify mode changes nothing. On the runner nothing is connected, so the tunnel post-conditions must
          # hold; the runner's own resolver reachability is environment-dependent and is reported, not gated.
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          & scripts/windows/reliability-check.ps1 -Mode Verify -Report artifacts/windows/reliability-verify.json -WaitSeconds 5
          Write-Host "reliability-check exit code: $LASTEXITCODE"
          $r = Get-Content artifacts/windows/reliability-verify.json -Raw | ConvertFrom-Json
          $hard = @($r.results | Where-Object { $_.status -eq 'FAIL' -and $_.case_id -in @('T09-tunnel-closed','T08-no-auto-reconnect','T01-noproxy') })
          if ($hard.Count -gt 0) { throw "post-condition failed on an idle runner: $($hard.case_id -join ', ')" }
          exit 0

      - name: Service suite - Windows kernel tests, internal stage, real install, GUI to Service to Core, attacks
        run: py -3 scripts/test-native-windows.py --suite service --allow-service-install --out artifacts/windows/service --report artifacts/windows/service-suite.json

      - name: Install Inno Setup (pinned; the installer compiler, not shipped)
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup $env:INNO_VERSION could not be installed" }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after install' }
          & $iscc /? | Select-Object -First 2

      - name: Release suite - TEST-signed installer, real silent install / reinstall / refused upgrade / rollback / downgrade / uninstall (self-signed certificate, NOT a trusted release)
        run: py -3 scripts/test-native-windows.py --suite release --allow-service-install --sign test --out artifacts/windows/release --report artifacts/windows/release-suite.json

      - name: Collect the test-machine kit (internal stage + e2e scripts, unsigned)
        if: always()
        shell: pwsh
        run: |
          $stage = 'artifacts/windows/service/stage'
          if (Test-Path "$stage/manifest.json") {
            New-Item -ItemType Directory -Force artifacts/windows/kit | Out-Null
            Copy-Item $stage artifacts/windows/kit/stage -Recurse
            Copy-Item scripts/windows artifacts/windows/kit/scripts -Recurse
          }

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-foundation-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/windows/machine.json
            artifacts/windows/gui-selftest.json
            artifacts/windows/service-probe.txt
            artifacts/windows/core-suite.json
            artifacts/windows/billing-suite.json
            artifacts/windows/grants-suite.json
            artifacts/windows/service-suite.json
            artifacts/windows/release-suite.json
            artifacts/windows/release/release-check.json
            artifacts/windows/service/e2e-service.json
            artifacts/windows/reliability-verify.json
            artifacts/windows/wintun-signature.txt
            artifacts/windows/test-results/*.trx

      - name: Retain the GUI design preview (PNG per page and state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-preview
          if-no-files-found: ignore
          retention-days: 14
          path: artifacts/windows/ui-preview

      - name: Retain the internal stage and e2e scripts for the authorised test machine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-stage
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/windows/kit

      - name: Retain the TEST-signed installer folder (internal channel, self-signed, for the authorised test machine)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-signed
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/windows/release/installer

      - name: Retain the TUN harness build for the authorised test machine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-poc
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/windows/core/asterlink-core.exe
            artifacts/windows/core/asterlink-tuntest.exe
            artifacts/windows/billing/asterlink-billtest.exe
            artifacts/windows/billing/asterlink-trafficsink.exe
            artifacts/windows/billing/asterlink-trafficsink-linux-amd64
            artifacts/windows/grants/asterlink-billtest-windows-amd64.exe
            artifacts/windows/grants/asterlink-billtest-darwin-arm64
            artifacts/windows/grants/asterlink-billtest-linux-amd64

  contracts-portable:
    name: Foundation suite on Linux (lock file, env parsers, C# contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/core/go.sum
      - name: Lock file, Python env parser and C# contract tests
        run: python3 scripts/test-native-windows.py --suite foundation
      - name: Cross-build the Windows Core from Linux, vet it, check the platform split and the Wintun hash
        run: python3 scripts/test-native-windows.py --suite core --out "$RUNNER_TEMP/windows-core"
      - name: Release suite, portable part (checksums, installer script contract, PowerShell syntax; the installer itself is BLOCKED off Windows by design)
        run: |
          set +e
          python3 scripts/test-native-windows.py --suite release
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
