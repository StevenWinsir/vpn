name: VPN CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    name: Backend / PostgreSQL / race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The real Core binary (with the pinned Mihomo submodule) is built for the end-to-end
      # ledger tests, so the submodule and the Core's module cache are needed here too.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The Core of the last release before node groups is built from history and driven
      # against this tree (TestReleasedCoreAgainstNodeGroupsPostgres); the checkout is shallow.
      - name: Fetch the released Core commit (a63a882)
        run: git fetch --no-tags --depth=1 origin a63a882ff41d83f04a0527128c96d9b8a9782365
      - name: Prepare the hash-locked Mihomo lifecycle patch
        run: python3 scripts/prepare_mihomo.py
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            native/core/go.sum
      - name: Install private PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Download locked Go dependencies
        run: |
          (cd backend && go mod download)
          (cd native/core && go mod download)
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Isolated database regressions
        env:
          REQUIRE_RELEASED_CORE: '1'
        run: python3 scripts/test-native.py

  web-core:
    name: Browser / node catalog / legacy Mihomo ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare the hash-locked Mihomo lifecycle patch
        run: python3 scripts/prepare_mihomo.py
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            native/legacy-core/go.sum
            native/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Download locked dependencies
        run: |
          (cd backend && go mod download)
          (cd native/legacy-core && go mod download)
          npm ci --prefix frontend
      - name: Install isolated browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Web validation
        working-directory: frontend
        run: |
          npm run lint
          npm run build -- --webpack
          npm run typecheck
          npm run test:api-proxy
          npm run test:nodes
          npm run test:downloads
          npm run test:dashboard
          npm run test:referral
          npm run test:copy
      - name: Legacy managed-core regressions (kept until the new Core re-implements them in stage 2)
        working-directory: native/legacy-core
        run: |
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          go test -race -count=1 ./managed
      - name: Real browser to database to proxy acceptance
        run: python3 scripts/test-node-catalog.py --skip-build --output artifacts/ci-catalog
      - name: Browser checkout against the local payment gateway fake
        run: python3 scripts/test-payment-web.py --skip-build --output artifacts/ci-payment
      - name: Retain payment browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-web-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/ci-payment/summary.json
            artifacts/ci-payment/browser-artifacts/screens/*.png
      - name: Retain sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-catalog-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/ci-catalog/summary.json
            artifacts/ci-catalog/traffic-evidence.json
            artifacts/ci-catalog/browser-artifacts/nodes-desktop.png
            artifacts/ci-catalog/browser-artifacts/nodes-mobile.png

  release-rehearsal:
    name: Release rehearsal / migration / rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The drill builds the legacy release, the node-group rollback target and the
      # pre-payment rollback target from history, so the whole history is needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Download locked dependencies (current tree and the three older releases; the drill builds offline)
        run: |
          (cd backend && go mod download)
          npm ci --prefix frontend
          for ref in 67e7b37f935e654e4378c14a32bc888ccff2065f a63a882 9ee9066; do
            tree="$(mktemp -d)"
            git archive "$ref" backend | tar -x -C "$tree"
            (cd "$tree/backend" && go mod download)
          done
      - name: Install isolated browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Upgrade, payments, impersonation revoke, backup/restore and both rollbacks
        run: python3 scripts/test-release-rehearsal.py --output artifacts/ci-rehearsal
      - name: Retain rehearsal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/ci-rehearsal/summary.json
            artifacts/ci-rehearsal/*.log

  native-core:
    name: Native Core / IPC contract / shared policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare the hash-locked Mihomo lifecycle patch
        run: python3 scripts/prepare_mihomo.py
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.mod
            native/core/go.sum
            backend/go.sum
      - name: Env contract (Python parser)
        working-directory: scripts
        run: python3 test-native-env.py
      - name: Mihomo patch integrity and real NAT lifecycle regression (no TUN required)
        run: python3 scripts/test-mihomo-patches.py
      - name: Core IPC, metering, state machine, engine template (race) and vet
        working-directory: native/core
        run: |
          CGO_ENABLED=1 go test -race -count=1 ./...
          go vet ./...
          # The test-only fake engine (used by the end-to-end ledger tests) must keep compiling.
          go vet -tags fakeengine ./...
          # The privileged TUN harness is built here, never run (it changes machine routes).
          CGO_ENABLED=0 go build -o /tmp/asterlink-tuntest ./cmd/asterlink-tuntest
      - name: Node agent (reference VLESS forwarder, report cursors, crash recovery) race and vet
        working-directory: native/nodeagent
        run: |
          CGO_ENABLED=1 go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/asterlink-nodeagent ./cmd/asterlink-nodeagent
      - name: Shared policy including pinned Mihomo schema check
        working-directory: shared/nodepolicy
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Backend copies are generated from shared/
        run: python3 scripts/sync-backend-shared.py --check

  macos:
    name: macOS App / Helper / Core bundle
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare the hash-locked Mihomo lifecycle patch
        run: python3 scripts/prepare_mihomo.py
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.mod
            native/core/go.sum
            native/tunpoc/go.sum
      - name: Toolchain versions (recorded, not assumed)
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          swift --version
          go version
          sw_vers
      - name: Unit suite (Go IPC, shared policy, env contract, Swift)
        run: python3 scripts/test-native-macos.py --suite unit --run-id ci
      - name: Bundle suite (Debug app, ad-hoc signed; Helper -> verified Core handshake + tamper refusals)
        run: python3 scripts/test-native-macos.py --suite bundle --run-id ci
      - name: Release suite (optimized ad-hoc DMG; signature, entitlements, secrets, manifests, licenses, uninstaller)
        run: |
          # Exit 3 = BLOCKED cases (Gatekeeper / notarization need a Developer ID). Only 0 or 3 may pass.
          set +e
          python3 scripts/test-native-macos.py --suite release --run-id ci
          code=$?
          test $code -eq 0 -o $code -eq 3
      - name: "TUN proof of concept compiles (it is NOT run in CI, because it changes machine routes)"
        working-directory: native/tunpoc
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go build -o /tmp/tunpoc .
      - name: TUN suite must report BLOCKED without explicit consent
        run: |
          set +e
          python3 scripts/test-native-macos.py --suite tun --run-id ci
          test $? -eq 3
      - name: Retain sanitized build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/native-macos/*-report-*/test-report.json
            artifacts/native-macos/*/build-manifest.json
      - name: Retain the internal (ad-hoc, NOT notarized) installer for manual testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterlink-internal-adhoc-dmg
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/native-macos/ci-release/release/*.dmg
            artifacts/native-macos/ci-release/release/SHA256SUMS
            artifacts/native-macos/ci-release/release/release-manifest.json
