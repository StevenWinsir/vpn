name: VPN CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  FLUTTER_VERSION: '3.47.1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    name: Backend / PostgreSQL / race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Install private PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Download locked Go dependencies
        working-directory: backend
        run: go mod download
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Isolated database regressions
        run: python3 scripts/test-native.py

  web-core:
    name: Browser / node catalog / Mihomo ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            FlClash/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Download locked dependencies
        run: |
          (cd backend && go mod download)
          (cd FlClash/core && go mod download)
          npm ci --prefix frontend
      - name: Install isolated browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Web validation
        working-directory: frontend
        run: |
          npm run lint
          npm run build -- --webpack
          npm run typecheck
          npm run test:api-proxy
      - name: Core regressions without coverage instrumentation
        working-directory: FlClash/core
        run: |
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          go test -race -count=1 ./managed
      - name: Real browser to database to proxy acceptance
        run: python3 scripts/test-node-catalog.py --skip-build --output artifacts/ci-catalog
      - name: Retain sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-catalog-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/ci-catalog/summary.json
            artifacts/ci-catalog/traffic-evidence.json

  flutter:
    name: Flutter / account and lifecycle regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FlClash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Isolate unit tests from native build hooks
        run: |
          cp pubspec.yaml /tmp/vpn-original-pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          source = p.read_text()
          assert source.count('build_assets: true') == 2
          p.write_text(source.replace('build_assets: true', 'build_assets: false'))
          PY
      - name: Full Flutter suite
        run: |
          ulimit -n 4096
          flutter test --reporter expanded --concurrency=2 --coverage
      - name: Existing coverage gate
        run: dart run tool/check_coverage.dart coverage/lcov.info 75
      - name: Restore native build settings
        if: always()
        run: |
          if [ -f /tmp/vpn-original-pubspec.yaml ]; then
            cp /tmp/vpn-original-pubspec.yaml pubspec.yaml
          fi
      - name: Platform proxy ownership tests
        working-directory: FlClash/plugins/proxy
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build configuration tests
        working-directory: FlClash/plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  macos:
    name: macOS native build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned Xcode and required Network SDK
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          printf '%s\n' 'import Network' '@available(macOS 26.0, *)' 'func verifyNetworkSDK(_ path: NWPath) { _ = path.isUltraConstrained }' | xcrun swiftc -typecheck -
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: FlClash/core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            FlClash/plugins/rust_api/rust
            FlClash/services/helper
      - name: Native macOS application (no acceptance tags)
        run: |
          printf '%s\n' 'CLIENT_API_BASE=https://ci.example.invalid/api/v1/client' > FlClash/.env
          bash scripts/flclash-env.sh flutter pub get
          bash scripts/flclash-env.sh flutter build macos --debug --no-pub --target=lib/main.dart
      - name: Verify native bundle
        run: |
          bundle=FlClash/build/macos/Build/Products/Debug/FlClash.app
          test -x "$bundle/Contents/MacOS/FlClash"
          test -x "$bundle/Contents/MacOS/FlClashCore"
          go version -m "$bundle/Contents/MacOS/FlClashCore" > /tmp/vpn-core-build.txt
          if grep -q 'managed_acceptance' /tmp/vpn-core-build.txt; then
            echo 'Acceptance-only code must not ship in the normal app.' >&2
            exit 1
          fi
          grep -Eq -- '-tags=.*with_gvisor' /tmp/vpn-core-build.txt
          grep -Fq -- '-X core/managed.APIBase=https://ci.example.invalid/api/v1/client' /tmp/vpn-core-build.txt
          codesign --verify --deep --strict "$bundle"
      - name: Verify signatures after an incremental Dart entrypoint change
        run: |
          bash scripts/flclash-env.sh flutter build macos --debug --no-pub --target=integration_test/managed_account_test.dart
          codesign --verify --deep --strict FlClash/build/macos/Build/Products/Debug/FlClash.app
      - name: Real Flutter authorization and Core restart lifecycle
        run: |
          core=FlClash/build/macos/Build/Products/Debug/FlClash.app/Contents/MacOS/FlClashCore
          trap 'if [ -f "$core" ]; then sudo chmod 0755 "$core"; sudo chown "$(id -u):$(id -g)" "$core"; fi' EXIT
          bash scripts/flclash-env.sh flutter clean
          bash scripts/flclash-env.sh flutter pub get
          bash scripts/flclash-env.sh flutter drive -d macos --debug --no-pub --target=integration_test/managed_core_restart_test.dart --driver=test_driver/managed_account_test.dart --dart-define=RESTART_AUTHORIZE_TEST=true --timeout=120
      - name: Restore and verify the normal application entrypoint
        # A superseded disposable runner does not need another native build.
        # Still verify restoration after an actual test failure, not cancellation.
        if: ${{ !cancelled() }}
        run: |
          bash scripts/flclash-env.sh flutter build macos --debug --no-pub --target=lib/main.dart
          codesign --verify --deep --strict FlClash/build/macos/Build/Products/Debug/FlClash.app
