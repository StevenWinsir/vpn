name: Android client CI

# Scope (round 1, handoff_app_android.md 10): the toolchain lock agrees with the build, the Go
# Core's Android platform split is right, gomobile binds the Core + pinned Mihomo into an AAR
# whose libgojni.so is ELF for its ABI, 16 KB aligned and reproducible, the Debug APK builds
# with the .so stored uncompressed, the env-v1 parser and JVM tests pass, and on a KVM x86_64
# emulator the app starts the real Core, shows its version and the instrumented binding test
# passes. Round 2 adds the tun job: a real VpnService TUN inside the emulator only; the
# runner's own network is never changed. Round 3 adds the ui suite (Roborazzi screenshots of
# every page and state on the JVM) to the build job and the account suite (the app's real
# SessionController + Core + Keystore against the real backend on a private PostgreSQL,
# reached through adb reverse) to the emulator job. Round 4 adds the billing job: the production
# APK connects for real (SessionController -> AsterVpnService -> Core gates, first ACK, TUN,
# Verify) and the server's ledger is checked to the unit, plus the automatic stop paths and the
# node agent's own billing (scripts/test-native-android.py --suite billing). Round 5 adds the
# lifecycle job (--suite lifecycle): the authorization gate, Doze, network changes, a competing
# VPN and process death on the production build. Round 6 adds the release job: the R8-minified,
# ABI-split release APKs signed by apksigner (v2+v3) with a THROWAWAY key (the real release key
# never leaves the release machine), packaged with notices, inventory, GPL source archives and
# SHA256SUMS, audited (--suite release), and rehearsed on the emulator through the real UI:
# install, sign in, VPN consent, connect, upgrade in place, downgrade/foreign-key refusal, uninstall.
# x86_64 is built only so the Linux runner can run the app; the product ABI is arm64-v8a.

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'native/core/**'
      - 'native/third_party/**'
      - 'scripts/prepare_mihomo.py'
      - 'scripts/test-mihomo-patches.py'
      - 'shared/**'
      - 'scripts/build-native-android.py'
      - 'scripts/package-native-android.py'
      - 'scripts/android_release_suite.py'
      - 'scripts/collect_licenses.py'
      - 'scripts/third_party_licenses/**'
      - 'scripts/test-native-android.py'
      - 'scripts/native_env.py'
      - 'scripts/loopback_port.py'
      - 'backend/**'
      - 'native/nodeagent/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'native/core/**'
      - 'native/third_party/**'
      - 'scripts/prepare_mihomo.py'
      - 'scripts/test-mihomo-patches.py'
      - 'shared/**'
      - 'scripts/build-native-android.py'
      - 'scripts/package-native-android.py'
      - 'scripts/android_release_suite.py'
      - 'scripts/collect_licenses.py'
      - 'scripts/third_party_licenses/**'
      - 'scripts/test-native-android.py'
      - 'scripts/native_env.py'
      - 'scripts/loopback_port.py'
      - 'backend/**'
      - 'native/nodeagent/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_PLATFORM: 'platforms;android-37.0'
  EMULATOR_IMAGE: 'system-images;android-36;google_apis;x86_64'

jobs:
  build:
    name: Android build / AAR / APK / unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Toolchain versions (recorded, not assumed)
        run: |
          go version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Android SDK packages from the lock (the runner's single SDK)
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - name: Foundation suite (lock, env, Go platform split, manifest baseline)
        run: python3 scripts/test-native-android.py --suite foundation --report artifacts/native-android/foundation-report.json
      - name: Core AAR (gomobile, arm64-v8a + x86_64, bound twice to prove the .so is reproducible)
        run: python3 scripts/build-native-android.py --target aar --abi arm64-v8a --abi x86_64 --check-reproducible
      - name: Debug APK (uncompressed .so, zipalign -P 16)
        run: python3 scripts/build-native-android.py --target apk --abi arm64-v8a --abi x86_64
      - name: Unit suite (Go binding/IPC/network/managed, env-v1 parser, app JVM tests)
        run: python3 scripts/test-native-android.py --suite unit --report artifacts/native-android/unit-report.json
      - name: UI suite (Roborazzi screenshots of every page and state, dark, 200 % font, 360 dp, English)
        run: python3 scripts/test-native-android.py --suite ui --report artifacts/native-android/ui-report.json
      - name: Retain the Core AAR for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: android-core-aar
          path: apps/android/build/core/
          retention-days: 3
      - name: Retain the Debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/native-android/
          retention-days: 14
          if-no-files-found: ignore

  emulator:
    name: Android emulator (API 36 x86_64, KVM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, system image and the NDK (the Go binding tests are cross-compiled for the device)
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" emulator "$EMULATOR_IMAGE" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-core-aar
          path: apps/android/build/core/
      - name: Debug APK from the tested Core AAR
        run: python3 scripts/build-native-android.py --target apk --abi arm64-v8a --abi x86_64
      - name: Emulator suite (real AAR in the app process; no VPN, no host network change)
        run: python3 scripts/test-native-android.py --suite emulator --api 36 --abi x86_64 --keep-emulator --report artifacts/native-android/emulator-report.json
      - name: PostgreSQL binaries for the private test database (the runner's preinstalled server stays stopped)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Account suite (sign-in, remember password, plans, admin edits; backend on a private PostgreSQL via adb reverse)
        run: python3 scripts/test-native-android.py --suite account --api 36 --abi x86_64 --report artifacts/native-android/account-report.json
      - name: Retain emulator evidence (screenshot, device facts, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: artifacts/native-android/
          retention-days: 14
          if-no-files-found: ignore

  tun:
    # Round 2: the real VpnService TUN inside the emulator, against a controlled test node and
    # traffic sink started on the runner (scripts/test-native-android.py --suite tun). The VPN
    # exists only inside the emulator; the runner's own network is not changed. This job binds
    # its own Core AAR with the debug-only acceptance hooks; that AAR never leaves the job.
    name: Android TUN acceptance (API 36 x86_64, KVM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, system image and the NDK
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" emulator "$EMULATOR_IMAGE" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - name: TUN suite (hooks AAR, VpnService, SS/VLESS/REALITY, DNS, UDP, IPv6, loop, stop, kill, cycles)
        # The runner has no IPv6 upstream and no real node: those two stay BLOCKED in the report.
        run: python3 scripts/test-native-android.py --suite tun --allow-network-changes --api 36 --abi x86_64 --cycles 10 --expect-blocked tun.T04-ipv6,tun.T02-real --report artifacts/native-android/tun/report.json
      - name: Retain TUN evidence (report, instrumentation output; tokens redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tun-evidence
          path: artifacts/native-android/tun/
          retention-days: 14
          if-no-files-found: ignore

  billing:
    # Round 4: connection loop and development metering on the PRODUCTION build (no acceptance
    # hook in the AAR): B01 1x/0.5x to the unit, B02 a lost acknowledgement charged once, A04
    # re-rate / disable / plan end / quota exhaustion stop the tunnel by themselves, N01/N02 the
    # notifications, B04 the real node agent bills a node-reported connection with no client
    # report. Backend world on a private PostgreSQL, test node + sink + node agent on the
    # runner's loopback; the VPN exists only inside the emulator.
    name: Android connection and billing acceptance (API 36 x86_64, KVM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, system image and the NDK
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" emulator "$EMULATOR_IMAGE" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-core-aar
          path: apps/android/build/core/
      - name: Debug and test APKs from the tested production Core AAR
        run: |
          python3 scripts/build-native-android.py --target apk --abi arm64-v8a --abi x86_64
          (cd apps/android && ./gradlew --console=plain :app:assembleDebugAndroidTest)
      - name: PostgreSQL binaries for the private test database (the runner's preinstalled server stays stopped)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Billing suite (B01, B02, A04, N01/N02, B04; smaller transfers than the local 20/80 MiB run)
        run: python3 scripts/test-native-android.py --suite billing --allow-network-changes --skip-build --api 36 --abi x86_64 --upload-mib 4 --download-mib 16 --report artifacts/native-android/billing/report.json --out artifacts/native-android/billing
      - name: Retain billing evidence (report, instrumentation output, world log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-billing-evidence
          path: artifacts/native-android/billing/
          retention-days: 14
          if-no-files-found: ignore

  lifecycle:
    # Round 5: mobile lifecycle on the PRODUCTION build: the authorization gate after a stall,
    # with the server unreachable and across Wi-Fi/cellular/airplane changes, Doze, the catalog
    # poll in the background, a second VPN app taking over, the task removed, am kill /
    # force-stop, cycles and a short soak. Shorter screen-off and soak than the local run; the
    # reboot (L06) runs locally only. The VPN and every network change exist only inside the emulator.
    name: Android lifecycle acceptance (API 36 x86_64, KVM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, system image and the NDK
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" emulator "$EMULATOR_IMAGE" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-core-aar
          path: apps/android/build/core/
      - name: Debug and test APKs from the tested production Core AAR
        run: |
          python3 scripts/build-native-android.py --target apk --abi arm64-v8a --abi x86_64
          (cd apps/android && ./gradlew --console=plain :app:assembleDebugAndroidTest)
      - name: PostgreSQL binaries for the private test database (the runner's preinstalled server stays stopped)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Lifecycle suite (N01, L01-L05, L07 short; L06 reboot and the 8-hour soak run locally)
        run: python3 scripts/test-native-android.py --suite lifecycle --allow-network-changes --skip-build --api 36 --abi x86_64 --screen-off-seconds 30 --soak-seconds 60 --cycles 10 --no-reboot --report artifacts/native-android/lifecycle/report.json --out artifacts/native-android/lifecycle
      - name: Retain lifecycle evidence (report, instrumentation output, soak samples, world log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lifecycle-evidence
          path: artifacts/native-android/lifecycle/
          retention-days: 14
          if-no-files-found: ignore

  release:
    # Round 6: release packaging and its audit. The publish build carries arm64-v8a (the product
    # ABI) and x86_64 (only so this runner's KVM emulator can install it); both are signed with a
    # throwaway key, so release.R03-release-key is BLOCKED by design, and no real phone exists
    # here (release.R04-device). Everything else must pass.
    name: Android release packaging, audit and install rehearsal (API 36 x86_64, KVM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            native/core/go.sum
            backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, system image and the NDK
        # A corrupt download ("Error on ZipFile unknown archive") is retried; sdkmanager verifies each package.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION" "build-tools;36.0.0" emulator "$EMULATOR_IMAGE" > /dev/null; then exit 0; fi
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - name: Release package (R8, ABI splits, apksigner v2+v3 with a throwaway key, notices, GPL source, SHA256SUMS)
        run: |
          printf 'APP_ENV=release\nAPI_BASE_URL=https://demo.hyshentou.cn/api/v1/client\nWEBSITE_BASE_URL=https://test.hyshentou.cn\n' > "$RUNNER_TEMP/release.env"
          python3 scripts/package-native-android.py --channel internal --key ephemeral --env-file "$RUNNER_TEMP/release.env" --abi arm64-v8a --abi x86_64
      - name: PostgreSQL binaries for the private test database (the runner's preinstalled server stays stopped)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Release suite (R03 audit, R01 install/start, R01/R02 rehearsal through the UI)
        run: python3 scripts/test-native-android.py --suite release --allow-network-changes --avds api36 --abi x86_64 --expect-blocked release.R03-release-key,release.R04-device --report artifacts/native-android/release-suite/report.json
      - name: Retain release evidence (report, release-info, notices; the throwaway-signed APKs are not kept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-evidence
          path: |
            artifacts/native-android/release-suite/
            artifacts/native-android/release/release-info.json
            artifacts/native-android/release/SHA256SUMS
            artifacts/native-android/release/THIRD_PARTY_LICENSES.txt
          retention-days: 14
          if-no-files-found: ignore
