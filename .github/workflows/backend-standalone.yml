name: Standalone backend deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Backend-only build / shared-source parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Deliberately do not initialize the Mihomo submodule.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - name: Shared snapshot integrity and drift regressions
        run: |
          python3 scripts/test-backend-shared.py
          python3 scripts/sync-backend-shared.py --check
      - name: Download locked Go dependencies
        working-directory: backend
        run: go mod download
      - name: Only backend, renamed deployment folder, no FlClash
        run: python3 scripts/test-backend-standalone.py
